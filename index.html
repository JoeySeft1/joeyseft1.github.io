document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background:var(--paper);color:var(--ink);transition:background 240ms ease,color 240ms ease\">\n\n  <header style=\"position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px clamp(20px,5vw,72px);background:var(--paper);border-bottom:1px solid var(--line)\">\n    <span id=\"scroll-progress\" style=\"position:absolute;left:0;bottom:-1px;width:100%;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;pointer-events:none\"><\u002Fspan>\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font-family:inherit\">\n      <span id=\"brand-name\" style=\"font-size:17px;font-weight:600;letter-spacing:-0.02em;transition:font-size 300ms ease\">Joseph Nguyen<\u002Fspan>\n      <span id=\"brand-loc\" style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mute);transition:opacity 300ms ease,max-width 300ms ease;overflow:hidden;white-space:nowrap\">College Station, TX<\u002Fspan>\n    <\u002Fbutton>\n    <nav style=\"position:relative;display:flex;align-items:center;gap:4px\">\n      <span id=\"nav-pill\" style=\"position:absolute;left:0;top:50%;height:28px;margin-top:-14px;border-radius:6px;background:var(--accent-soft);opacity:0;transform:translateX(0);transition:transform 420ms cubic-bezier(.16,.84,.24,1),width 420ms cubic-bezier(.16,.84,.24,1),opacity 260ms ease;pointer-events:none\"><\u002Fspan>\n      <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ item.go }}\" data-active=\"{{ item.active }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:0;padding:8px 11px;border-radius:6px;cursor:pointer;color:{{ item.color }}\" style-hover=\"color:var(--ink);background:var(--accent-soft)\">{{ item.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Toggle light / dark\" style=\"margin-left:14px;display:flex;align-items:center;gap:9px;height:34px;padding:0 13px 0 10px;border:1px solid var(--line);background:var(--raise);border-radius:999px;cursor:pointer;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase\" style-hover=\"border-color:var(--accent);color:var(--accent)\">\n        <span style=\"width:15px;height:15px;border-radius:999px;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)\"><\u002Fspan>\n        <span>{{ themeLabel }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"padding:0 clamp(20px,5vw,72px) 96px;max-width:1180px;margin:0 auto;animation:pageIn 520ms cubic-bezier(.16,.84,.24,1)\">\n    <section style=\"padding:clamp(56px,9vw,120px) 0 clamp(40px,6vw,72px);border-bottom:1px solid var(--line)\">\n      <p data-reveal=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin:0 0 26px\">Mechanical Engineering · Software Development<\u002Fp>\n      <h1 data-reveal=\"1\" data-parallax=\"-0.05\" data-parallax-fade=\"1\" style=\"will-change:transform,opacity;font-size:clamp(38px,6.4vw,78px);line-height:1.02;letter-spacing:-0.035em;font-weight:600;margin:0;max-width:19ch;text-wrap:pretty\">I like building the tools I wish existed.<\u002Fh1>\n      <p data-reveal=\"1\" style=\"margin:28px 0 0;font-size:clamp(16px,1.55vw,20px);line-height:1.55;color:var(--mute);max-width:56ch;text-wrap:pretty\">I'm a mechanical engineering student at Texas A&amp;M, originally from Cypress, Texas. Last summer I g x solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,64px);align-items:start\">\n      <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);font-weight:500\">Involvement<\u002Fh2>\n      <div style=\"display:flex;gap:clamp(18px,3vw,30px);align-items:flex-start\">\n        <img src=\"e080edeb-b952-4eb4-96bd-d6491108988d\" alt=\"ASME Texas A&amp;M\" data-fx=\"drift\" data-k=\"0.07\" style=\"width:104px;height:auto;flex:0 0 auto;filter:{{ logoFilter }}\">\n        <div>\n          <div style=\"font-size:clamp(18px,1.8vw,23px);font-weight:600;letter-spacing:-0.02em;line-height:1.3\">ASME at Texas A&amp;M<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:15.5px;line-height:1.6;color:var(--mute);max-width:46ch;text-wrap:pretty\">I’m a member of the American Society of Mechanical Engineers student section, which keeps me around people building the physical side of engineering.<\u002Fp>\n          <div style=\"margin-top:24px;padding-top:22px;border-top:1px solid var(--line)\">\n            <div style=\"font-size:clamp(18px,1.8vw,23px);font-weight:600;letter-spacing:-0.02em;line-height:1.3\">Baja SAE at Texas A&amp;M <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);vertical-align:middle\">Applied<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:10px 0 0;font-size:15.5px;line-height:1.6;color:var(--mute);max-width:46ch;text-wrap:pretty\">My application is in for the Controls/DAQ and chassis subteams. It’s the closest thing on campus to the work I want to be doing: build the car, instrument it, then let the data decide.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-reveal=\"1\" style=\"padding:clamp(40px,5vw,72px) 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,64px);align-items:start\">\n      <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);font-weight:500\">Education<\u002Fh2>\n      <div style=\"display:flex;gap:clamp(18px,3vw,30px);align-items:flex-start\">\n        <span style=\"width:200px;height:200px;flex:0 0 auto;background:{{ platebg }};border-radius:14px;display:grid;place-items:center;padding:24px;box-sizing:border-box\">\n          <img src=\"e2ad9f33-a7f8-4b29-a475-2b57c6d9244d\" alt=\"Texas A&amp;M University\" style=\"width:100%;height:auto;display:block\">\n        <\u002Fspan>\n        <div>\n          <div style=\"font-size:clamp(20px,2vw,26px);font-weight:600;letter-spacing:-0.02em\">Texas A&amp;M University<\u002Fdiv>\n          <div style=\"margin-top:10px;font-size:16px;line-height:1.6;color:var(--mute)\">B.S. Mechanical Engineering, started on the general engineering track<\u002Fdiv>\n          <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)\">Class of 2030<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-reveal=\"1\" style=\"padding:clamp(32px,4vw,48px) 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,64px);align-items:start\">\n      <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);font-weight:500\">Earlier<\u002Fh2>\n      <ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:10px\">\n        <sc-for list=\"{{ achievements }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <li style=\"font-size:14px;line-height:1.6;color:var(--mute);text-wrap:pretty\"><span style=\"color:var(--ink)\">{{ a.title }}<\u002Fspan>. {{ a.body }}<\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fsection>\n\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFun }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"padding:0 clamp(20px,5vw,72px) 96px;max-width:1180px;margin:0 auto;animation:pageIn 520ms cubic-bezier(.16,.84,.24,1)\">\n    <section style=\"padding:clamp(48px,7vw,96px) 0 clamp(32px,4vw,52px);border-bottom:1px solid var(--line)\">\n      <p data-reveal=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin:0 0 26px\">Off Hours<\u002Fp>\n      <h1 data-reveal=\"1\" style=\"font-size:clamp(34px,5vw,62px);line-height:1.05;letter-spacing:-0.03em;font-weight:600;margin:0;max-width:22ch;text-wrap:pretty\">Rally, GT3, and edits I make for the fun of it.<\u002Fh1>\n      <p data-reveal=\"1\" style=\"margin:26px 0 0;font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--mute);max-width:58ch;text-wrap:pretty\">F1 got me into cars, but rally and GT3 are what I actually love watching. The other half of my free time goes into editing: clips cut to music I like, made because I felt like making them.<\u002Fp>\n    <\u002Fsection>\n\n    <section data-reveal=\"1\" style=\"padding:clamp(40px,5vw,72px) 0;border-bottom:1px solid var(--line);display:grid;gap:clamp(28px,4vw,40px)\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)\">YouTube<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-0.025em;line-height:1.2\">Edits, for fun<\u002Fh2>\n        <p style=\"margin:14px 0 0;font-size:15.5px;line-height:1.65;color:var(--mute);max-width:44ch;text-wrap:pretty\">No brief, no audience to please, just clips I felt like putting together. It's the closest thing I have to a design practice: pacing, rhythm, and knowing when to cut.<\u002Fp>\n        <a href=\"https://www.youtube.com/@joeysngn\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:12px 19px;border-radius:8px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-size:14px;font-weight:500\" style-hover=\"border-color:var(--accent);color:var(--accent)\">Watch on YouTube <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute)\">@joeysngn<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:16px\">\n        <a href=\"https://youtu.be/1QXfKQYOhns\" target=\"_blank\" rel=\"noopener\" data-reveal=\"1\" data-fx=\"tilt\" style=\"display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--raise);transition:border-color 200ms ease,transform 200ms ease\" style-hover=\"border-color:var(--accent);transform:translateY(-3px)\">\n          <img src=\"e79db2f5-8a00-4a22-942c-a1cf41aa7ceb\" alt=\"Featured edit\" style=\"display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover\">\n          <span style=\"display:flex;justify-content:space-between;gap:12px;padding:15px 18px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mute)\"><span style=\"color:var(--accent)\">Featured edit<\u002Fspan><span>Watch<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;max-width:66%\">\n          <a href=\"https://youtu.be/dLpOFrdpbHs\" target=\"_blank\" rel=\"noopener\" data-reveal=\"1\" style=\"display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise);opacity:0.68;transition:opacity 200ms ease,border-color 200ms ease,transform 200ms ease\" style-hover=\"opacity:1;border-color:var(--accent);transform:translateY(-2px)\">\n            <img src=\"cfaf510f-0d45-4e69-9bbc-8becc81e6aee\" alt=\"Edit on YouTube\" style=\"display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover\">\n          <\u002Fa>\n          <a href=\"https://youtu.be/6zO7t4eRqhU\" target=\"_blank\" rel=\"noopener\" data-reveal=\"1\" style=\"display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise);opacity:0.68;transition:opacity 200ms ease,border-color 200ms ease,transform 200ms ease\" style-hover=\"opacity:1;border-color:var(--accent);transform:translateY(-2px)\">\n            <img src=\"e0746d8e-b5a4-4a8a-9858-836f43ab153a\" alt=\"Edit on YouTube\" style=\"display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover\">\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:clamp(40px,5vw,72px) 0;border-bottom:1px solid var(--line)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);font-weight:500\">Games<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mute)\">{{ doneCount }} of {{ totalCount }} done<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:20px 0 0;font-size:clamp(17px,1.9vw,24px);line-height:1.45;letter-spacing:-0.015em;max-width:40ch;text-wrap:pretty\">Games I'm working through. Click a card to move it along.<\u002Fp>\n      <div style=\"margin-top:22px;height:3px;background:var(--line);border-radius:99px;overflow:hidden;max-width:420px\">\n        <div style=\"height:100%;background:var(--accent);width:{{ donePct }};transition:width 400ms ease\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:28px\">\n        <sc-for list=\"{{ gameTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.go }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:{{ t.bg }};color:{{ t.color }}\" style-hover=\"border-color:var(--accent)\">\n            <span>{{ t.label }}<\u002Fspan><span style=\"opacity:0.6\">{{ t.count }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div id=\"games-wrap\" style=\"position:relative;margin-top:28px\">\n        <span id=\"games-glow\" style=\"position:absolute;inset:-30px;opacity:0;transition:opacity 300ms ease;pointer-events:none;border-radius:20px\"><\u002Fspan>\n        <div style=\"position:relative;max-height:560px;overflow-y:auto;padding-right:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,164px),1fr));gap:16px\">\n        <sc-for list=\"{{ visibleGames }}\" as=\"g\" hint-placeholder-count=\"12\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;transition:transform 260ms cubic-bezier(.16,.84,.24,1)\" style-hover=\"transform:translateY(-5px)\">\n            <image-slot id=\"{{ g.slug }}\" src=\"{{ g.cover }}\" shape=\"rounded\" radius=\"8\" style=\"width:100%;aspect-ratio:3/4\" placeholder=\"cover\"><\u002Fimage-slot>\n            <button sc-camel-on-click=\"{{ g.cycle }}\" style=\"text-align:left;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--ink)\" style-hover=\"color:var(--accent)\">\n              <span style=\"display:block;font-size:13.5px;font-weight:500;line-height:1.35;letter-spacing:-0.01em;text-wrap:pretty\">{{ g.title }}<\u002Fspan>\n              <span style=\"display:block;margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:{{ g.statusColor }}\">{{ g.statusLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:clamp(40px,5vw,72px) 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,64px);align-items:start\">\n      <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);font-weight:500\">The rest of it<\u002Fh2>\n      <ul style=\"list-style:none;padding:0;margin:0;display:grid;gap:24px\">\n        <sc-for list=\"{{ outside }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <li data-reveal=\"1\" style=\"border-top:1px solid var(--line);padding-top:20px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent)\">{{ o.label }}<\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:16px;line-height:1.65;color:var(--mute);max-width:60ch;text-wrap:pretty\">{{ o.text }}<\u002Fdiv>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"padding:0 clamp(20px,5vw,72px) 96px;max-width:1180px;margin:0 auto;animation:pageIn 520ms cubic-bezier(.16,.84,.24,1)\">\n    <section style=\"padding:clamp(56px,9vw,120px) 0 clamp(40px,6vw,72px);border-bottom:1px solid var(--line)\">\n      <h1 data-reveal=\"1\" style=\"font-size:clamp(34px,5.4vw,66px);line-height:1.05;letter-spacing:-0.03em;font-weight:600;margin:0;max-width:20ch;text-wrap:pretty\">Say hello. I'll get back to you quickly.<\u002Fh1>\n      <p data-reveal=\"1\" style=\"margin:26px 0 0;font-size:clamp(16px,1.55vw,20px);line-height:1.55;color:var(--mute);max-width:52ch;text-wrap:pretty\">Internships, research, or a team that could use someone on the data side of a car. I'd love to hear about it.<\u002Fp>\n    <\u002Fsection>\n    <section style=\"padding:clamp(36px,5vw,64px) 0\">\n      <div style=\"display:grid;gap:1px;background:var(--line)\">\n      <sc-for list=\"{{ contacts }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <a href=\"{{ c.href }}\" sc-camel-on-click=\"{{ c.click }}\" title=\"{{ c.title }}\" data-reveal=\"1\" style=\"background:var(--paper);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(16px,4vw,48px);align-items:baseline;padding:24px 4px;color:var(--ink)\" style-hover=\"color:var(--accent)\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mute)\">{{ c.label }}<\u002Fspan>\n          <span style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;font-size:clamp(17px,1.7vw,22px);letter-spacing:-0.015em\">{{ c.value }} <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mute)\">{{ c.hint }}<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n      <div style=\"background:var(--paper);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(16px,4vw,48px);align-items:baseline;padding:24px 4px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mute)\">Location<\u002Fspan>\n        <span style=\"font-size:clamp(17px,1.7vw,22px);letter-spacing:-0.015em\">College Station, TX<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <a href=\"Joseph-Nguyen-Resume.pdf\" download=\"\" style=\"display:inline-flex;align-items:center;gap:9px;padding:14px 22px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500\" style-hover=\"background:var(--accent);color:#fff\">Download résumé <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.7\">PDF<\u002Fspan><\u002Fa>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:1px solid var(--line);padding:26px clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mute)\">\n    <span>Joseph Nguyen · College Station, TX<\u002Fspan>\n    <span style=\"display:flex;gap:16px;align-items:center\"><span id=\"kbd-hint\" style=\"opacity:0.75\">1–5 to navigate · T for theme<\u002Fspan><span>{{ year }}<\u002Fspan><\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  state = { page: 'home', theme: 'light', filter: 'all', games: [], copied: false };\n\n  componentDidMount() {\n    try {\n      const saved = localStorage.getItem('jn-theme');\n      if (saved === 'dark' || saved === 'light') this.setState({ theme: saved });\n      else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) this.setState({ theme: 'dark' });\n    } catch (e) {}\n    this.setState({ games: this.loadGames() });\n    this.observe();\n    this.initScroll();\n  }\n  componentWillUnmount() { if (this._onScroll) removeEventListener('scroll', this._onScroll); }\n  componentDidUpdate(_p, prev) {\n    if (prev.page !== this.state.page) { window.scrollTo(0, 0); this.observe(); this.initScroll(); }\n    else if (this._placePill) requestAnimationFrame(this._placePill);\n  }\n\n  initScroll() {\n    if (!this._onScroll) {\n      this._onScroll = () => {\n        if (this._raf) return;\n        this._raf = requestAnimationFrame(() => {\n          this._raf = null;\n          const y = window.scrollY || 0;\n          if (this._bar) this._bar.style.transform = 'scaleX(' + Math.min(1, y / this._max) + ')';\n          const shrunk = y > 60;\n          if (this._brand && this._shrunk !== shrunk) {\n            this._shrunk = shrunk;\n            this._brand.style.fontSize = shrunk ? '15px' : '17px';\n            if (this._loc) {\n              this._loc.style.opacity = shrunk ? '0' : '1';\n              this._loc.style.maxWidth = shrunk ? '0px' : '220px';\n            }\n          }\n          const plx = this._plx || [];\n          for (let i = 0; i < plx.length; i++) {\n            const el = plx[i], k = parseFloat(el.dataset.parallax) || 0.08;\n            el.style.transform = 'translate3d(0,' + (y * k).toFixed(2) + 'px,0)';\n            if (el.dataset.parallaxFade) el.style.opacity = String(Math.max(0.15, 1 - y / 620));\n          }\n          if (this._reduced) return;\n          const dy = y - (this._lastY || 0);\n          this._lastY = y;\n          this._vel = (this._vel || 0) * 0.82 + dy * 0.18;\n          const skew = Math.max(-1.6, Math.min(1.6, this._vel * 0.05));\n          const vh = innerHeight, fx = this._fx || [];\n          for (let i = 0; i < fx.length; i++) {\n            const f = fx[i], el = f.el;\n            if (f.type === 'marquee') { el.style.transform = 'translate3d(' + (-y * f.k).toFixed(1) + 'px,0,0)'; continue; }\n            if (f.type === 'skew') { el.style.transform = 'skewY(' + skew.toFixed(3) + 'deg)'; continue; }\n            const r = el.getBoundingClientRect();\n            if (r.bottom < -400 || r.top > vh + 400) continue;\n            const centered = (r.top + r.height / 2 - vh / 2) / vh;\n            if (f.type === 'drift') {\n              el.style.transform = 'translate3d(0,' + (centered * -f.k * vh).toFixed(1) + 'px,0)';\n            } else if (f.type === 'tilt') {\n              const c = Math.max(-1, Math.min(1, centered));\n              el.style.transform = 'perspective(900px) rotateX(' + (c * -3.2).toFixed(2) + 'deg) translate3d(0,' + (c * -14).toFixed(1) + 'px,0) scale(' + (1 - Math.abs(c) * 0.015).toFixed(4) + ')';\n            } else if (f.type === 'grow') {\n              const p = Math.max(0, Math.min(1, (vh * 0.85 - r.top) / (r.height || 1)));\n              el.style.transform = 'scaleY(' + p.toFixed(3) + ')';\n            }\n          }\n        });\n      };\n      addEventListener('scroll', this._onScroll, { passive: true });\n    }\n    document.querySelectorAll('[data-sticky]').forEach(el => { el.style.position = 'sticky'; el.style.top = '86px'; });\n    requestAnimationFrame(() => {\n      this._bar = document.getElementById('scroll-progress');\n      this._plx = Array.from(document.querySelectorAll('[data-parallax]'));\n      this._reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n      this._fx = Array.from(document.querySelectorAll('[data-fx]')).map(el => {\n        el.style.willChange = 'transform';\n        return { el, type: el.dataset.fx, k: parseFloat(el.dataset.k) || 0.08 };\n      });\n      this._max = Math.max(1, document.documentElement.scrollHeight - innerHeight);\n      if (!this._ro && 'ResizeObserver' in window) {\n        this._ro = new ResizeObserver(() => { this._max = Math.max(1, document.documentElement.scrollHeight - innerHeight); });\n        this._ro.observe(document.body);\n      }\n      this.initSmoothScroll();\n      this.initFlourishes();\n      this._onScroll();\n    });\n  }\n\n  initSmoothScroll() {\n    if (this._smooth || this._reduced) return;\n    if (matchMedia('(hover: none)').matches) return;\n    this._smooth = true;\n    let target = window.scrollY, current = window.scrollY, running = false;\n    const inScroller = node => {\n      for (let el = node; el && el !== document.body; el = el.parentElement) {\n        if (el.scrollHeight > el.clientHeight + 4) {\n          const oy = getComputedStyle(el).overflowY;\n          if (oy === 'auto' || oy === 'scroll') return true;\n        }\n      }\n      return false;\n    };\n    const tick = () => {\n      current += (target - current) * 0.14;\n      if (Math.abs(target - current) < 0.4) { current = target; running = false; }\n      window.scrollTo(0, current);\n      if (running) requestAnimationFrame(tick);\n    };\n    addEventListener('wheel', e => {\n      if (e.ctrlKey || inScroller(e.target)) return;\n      e.preventDefault();\n      const max = document.documentElement.scrollHeight - innerHeight;\n      target = Math.max(0, Math.min(max, target + e.deltaY * 0.62));\n      if (!running) { running = true; current = window.scrollY; requestAnimationFrame(tick); }\n    }, { passive: false });\n    addEventListener('keydown', () => { target = window.scrollY; running = false; });\n  }\n\n  initFlourishes() {\n    // sliding nav pill\n    const nav = document.querySelector('header nav');\n    const pill = document.getElementById('nav-pill');\n    this._brand = document.getElementById('brand-name');\n    this._loc = document.getElementById('brand-loc');\n    if (nav && pill) {\n      const place = () => {\n        const active = nav.querySelector('button[data-active=\"true\"]');\n        if (!active) { pill.style.opacity = '0'; return; }\n        const nr = nav.getBoundingClientRect(), ar = active.getBoundingClientRect();\n        pill.style.width = ar.width + 'px';\n        pill.style.transform = 'translateX(' + (ar.left - nr.left) + 'px)';\n        pill.style.opacity = '1';\n      };\n      place();\n      if (!this._navResize) { this._navResize = () => this.initFlourishes(); addEventListener('resize', this._navResize); }\n      nav.querySelectorAll('button').forEach(b => {\n        if (b.dataset.hoverBound) return;\n        b.dataset.hoverBound = '1';\n        b.addEventListener('pointerenter', () => {\n          const nr = nav.getBoundingClientRect(), br = b.getBoundingClientRect();\n          if (!b.hasAttribute('data-active')) return;\n          pill.style.width = br.width + 'px';\n          pill.style.transform = 'translateX(' + (br.left - nr.left) + 'px)';\n        });\n      });\n      nav.addEventListener('pointerleave', place);\n      this._placePill = place;\n    }\n\n    // cursor spotlight over the games grid\n    const w  els.forEach(el => {\n        if (el.dataset.revealDone) return;\n        const key = el.parentElement;\n        const i = (seen.get(key) || 0); seen.set(key, i + 1);\n        if (el.getBoundingClientRect().top < innerHeight * 0.9) {\n          el.dataset.revealDone = '1'; el.style.opacity = '1'; el.style.filter = 'none';\n          if (!el.dataset.parallax && !el.dataset.fx) el.style.transform = 'none';\n          if (el.dataset.count) this.countUp(el);\n          return;\n        }\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(42px) scale(0.965)';\n        el.style.filter = 'blur(7px)';\n        el.style.transition = 'opacity 780ms cubic-bezier(.16,.84,.24,1) ' + (i * 80) + 'ms, transform 860ms cubic-bezier(.16,.84,.24,1) ' + (i * 80) + 'ms, filter 780ms ease ' + (i * 80) + 'ms';\n      });\n      const show = el => {\n        el.dataset.revealDone = '1'; el.style.opacity = '1'; el.style.filter = 'none';\n        if (!el.dataset.parallax && !el.dataset.fx) el.style.transform = 'none';\n        if (el.dataset.count) this.countUp(el);\n      };\n      if (!('IntersectionObserver' in window)) { els.forEach(show); return; }\n      const io = new IntersectionObserver(entries => {\n        entries.forEach(e => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });\n      els.forEach(el => { if (!el.dataset.revealDone) io.observe(el); });\n      setTimeout(() => els.forEach(el => { if (!el.dataset.revealDone) show(el); }), 2200);\n    };\n    requestAnimationFrame(() => requestAnimationFrame(run));\n  }\n\n  go(page) { return () => this.setState({ page }); }\n\n  copyText(text) {\n    const done = () => {\n      this.setState({ copied: true });\n      clearTimeout(this._copyTimer);\n      this._copyTimer = setTimeout(() => this.setState({ copied: false }), 1900);\n    };\n    const legacy = () => {\n      const ta = document.createElement('textarea');\n      ta.va
